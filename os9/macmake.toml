access_paths = [
    {class = "user", path = ".", recursive = true},
    {class = "system", anchor = "sdk", path = "sysroot", recursive = true},
]

[target.compiler]
standard = "c89"
prefix_header = "prefix.h"

[target.cfm_fragment]
output_name = "macTLSLib"
fragment_name = "macTLSLib"
main = "OSTLS_LibInit"
creator = "MTLS"
file_type = "shlb"
old_definition_version = 1
old_import_version = 0
current_version = 1
share_data = false
exports = "all"

[[target.libraries]]
name = "InterfaceLib"
kind = "system-import"

[[target.libraries]]
name = "MathLib"
kind = "system-import"

[[target.libraries]]
name = "CarbonLib"
kind = "system-import"
pef_fragments = [
  { fragment_name = "CarbonLib", offset = 0, length = 80688, weak_import = false },
  { fragment_name = "CarbonLib", offset = 80688, length = 91808, weak_import = false },
  { fragment_name = "CarbonLib", offset = 172496, length = 74960, weak_import = false },
  { fragment_name = "CarbonLib", offset = 247456, length = 5464, weak_import = false },
]

[[target.libraries]]
name = "MSL_C_Carbon"
kind = "archive"
path = "sdk/MSL_C_Carbon.Lib"

[[target.libraries]]
name = "MSL_Runtime_PPC_D"
kind = "archive"
path = "sdk/MSL_Runtime_PPC_D.Lib"

[target.sdk]
packages = ["macos9-sdk"]
requires = [
    "classic.universal-interfaces.headers",
    "classic.carbon.headers",
    "classic.carbon.imports",
    "classic.math.imports",
]
